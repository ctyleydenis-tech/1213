<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Fun Russia HUD</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== top info bar ===================== -->
  <div class="header">

    <!-- left: level / players / exp / id -->
    <div class="header-panel header-left">
      <div class="cell"><span class="k">LVL:</span><b id="hud-lvl">1</b></div>
      <div class="cell">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4.4 4-6.6 7-6.6s5.8 2.2 7 6.6"/></svg>
        <b id="hud-online">0</b>
      </div>
      <div class="cell"><span class="k">EXP:</span><b id="hud-exp">0/0</b></div>
      <div class="cell"><span class="k">ID:</span><b id="hud-id">0</b></div>
    </div>

    <!-- center: logo + brand -->
    <div class="header-panel header-center">
      <svg class="logo" viewBox="0 0 48 48">
        <path d="M24 4 L38 14 L36 30 L24 44 L12 30 L10 14 Z" fill="url(#lg)"/>
        <path d="M24 10 L30 18 L24 34 L18 18 Z" fill="#0b0b0d" opacity="0.55"/>
        <circle cx="19" cy="20" r="1.6" fill="#0b0b0d"/>
        <circle cx="29" cy="20" r="1.6" fill="#0b0b0d"/>
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff4d4d"/>
            <stop offset="1" stop-color="#a10f16"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="brand">
        <div class="brand-title">Fun Russia</div>
        <div class="brand-sub">Role Play</div>
      </div>
    </div>

    <!-- right: ping / district -->
    <div class="header-panel header-right">
      <div class="ping" id="hud-ping">0 (0ms)</div>
      <div class="district">
        <span class="district-badge" id="hud-district-id">0</span>
        <span id="hud-district-name">—</span>
      </div>
    </div>
  </div>

  <!-- ===================== vitals row ===================== -->
  <div class="vitals">
    <div class="vital vital-health">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.1 2.2 4.5 5.7 4c2-.3 3.8.6 4.9 2.1L12 8l1.4-1.9C14.5 4.6 16.3 3.7 18.3 4c3.5.5 5.3 4.1 3.7 7.7C19.5 16.4 12 21 12 21z"/></svg>
      <span id="hud-health">100</span>
    </div>
    <div class="vital vital-armor">
      <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/></svg>
      <span id="hud-armor">0</span>
    </div>
    <div class="vital vital-food">
      <svg viewBox="0 0 24 24"><path d="M4 11h16a1 1 0 0 1 1 1c0 4-3.5 7-9 7s-9-3-9-7a1 1 0 0 1 1-1z"/><path d="M6 11c0-4 2.5-7 6-7s6 3 6 7"/></svg>
      <span id="hud-food">100</span>
    </div>
    <div class="vital vital-action">
      <svg viewBox="0 0 24 24"><path d="M7 11V7a2 2 0 0 1 4 0v3M11 10.5V6a2 2 0 0 1 4 0v4.5M15 10.5V7a2 2 0 0 1 4 0v6c0 4-2.5 7-6.5 7-2.6 0-4.2-1-5.7-3L4 14.4c-.6-.9-.2-2 .8-2.3.7-.2 1.4 0 1.9.6L8 14"/></svg>
    </div>
  </div>

  <!-- ===================== money grid ===================== -->
  <div class="money-grid">
    <div class="money-row"><span class="ic money-cash">$</span><b id="hud-cash">0</b></div>
    <div class="money-row"><svg class="ic money-card" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><line x1="2.5" y1="10" x2="21.5" y2="10"/></svg><b id="hud-card">0</b></div>
    <div class="money-row"><svg class="ic money-weight" viewBox="0 0 24 24"><path d="M6 8h12l1.5 12h-15z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><b id="hud-weight">0</b></div>
    <div class="money-row"><svg class="ic money-bank" viewBox="0 0 24 24"><path d="M3 10 12 4l9 6"/><rect x="4" y="10" width="16" height="9"/><line x1="2" y1="21" x2="22" y2="21"/></svg><b id="hud-bank">0</b></div>
    <div class="money-row"><svg class="ic money-deposit" viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="8" ry="4"/><path d="M4 9v6c0 2.2 3.6 4 8 4s8-1.8 8-4V9"/></svg><b id="hud-deposit">0</b></div>
    <div class="money-row"><svg class="ic money-donate" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17" r="0.8"/></svg><b id="hud-donate">0</b></div>
  </div>

  <script src="hud.js"></script>
</body>
</html>
