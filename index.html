<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Fun Russia HUD</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== TOP LEFT: level / online / id ===================== -->
  <div class="tl-panel">
    <div class="tl-row">
      <svg class="tl-ic" viewBox="0 0 24 24"><path d="M12 2 2 8l10 6 10-6z"/><path d="M2 14l10 6 10-6" opacity="0.5"/></svg>
      <b id="hud-lvl">1</b>
      <span class="tl-sep"></span>
      <svg class="tl-ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4.4 4-6.6 7-6.6s5.8 2.2 7 6.6"/></svg>
      <b id="hud-online">0</b>
    </div>
    <div class="tl-exp-track"><div class="tl-exp-fill" id="hud-exp-fill"></div></div>
    <div class="tl-row tl-sub">
      <span id="hud-exp">0/0</span>
      <span class="tl-sep-dot">·</span>
      <span>ID:<b id="hud-id">0</b></span>
    </div>
  </div>

  <!-- ===================== TOP RIGHT: server tag / minimap / money ===================== -->
  <div class="tr-panel">
    <div class="tr-server">
      <div class="tr-server-name">Arizona</div>
      <div class="tr-server-sub">Role play</div>
    </div>

    <div class="tr-district" id="hud-district-name">Casa Grande</div>

    <div class="tr-money">
      <div class="money-row"><span class="ic money-cash">$</span><b id="hud-cash">0</b></div>
      <div class="money-row"><svg class="ic money-card" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><line x1="2.5" y1="10" x2="21.5" y2="10"/></svg><b id="hud-card">0</b></div>
      <div class="money-row"><svg class="ic money-donate" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17" r="0.8"/></svg><b id="hud-donate">0</b></div>
    </div>

    <div class="tr-ping" id="hud-ping">0ms</div>
  </div>

  <!-- ===================== VITALS (bottom-left) ===================== -->
  <div class="vitals">
    <div class="vital vital-health">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.1 2.2 4.5 5.7 4c2-.3 3.8.6 4.9 2.1L12 8l1.4-1.9C14.5 4.6 16.3 3.7 18.3 4c3.5.5 5.3 4.1 3.7 7.7C19.5 16.4 12 21 12 21z"/></svg>
      <span id="hud-health">100</span>
    </div>
    <div class="vital vital-armor">
      <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/></svg>
      <span id="hud-armor">0</span>
    </div>
    <div class="vital vital-food">
      <svg viewBox="0 0 24 24"><path d="M4 11h16a1 1 0 0 1 1 1c0 4-3.5 7-9 7s-9-3-9-7a1 1 0 0 1 1-1z"/><path d="M6 11c0-4 2.5-7 6-7s6 3 6 7"/></svg>
      <span id="hud-food">100</span>
    </div>
  </div>

  <!-- ===================== SPEEDOMETER (bottom-right, only when in vehicle) ===================== -->
  <div class="speedo" id="speedo" style="display:none;">
    <div class="speedo-left">
      <div class="speedo-belt" id="speedo-belt" title="Ремень">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M6 8l6-4 6 4M6 16l6 4 6-4"/></svg>
      </div>
      <div class="speedo-fuel-track">
        <div class="speedo-fuel-fill" id="speedo-fuel-fill"></div>
      </div>
      <div class="speedo-fuel-pct" id="speedo-fuel-pct">76%</div>
    </div>

    <div class="speedo-main">
      <svg class="speedo-arc" viewBox="0 0 200 110">
        <path d="M10 100 A90 90 0 0 1 190 100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" stroke-linecap="round"/>
        <path id="speedo-arc-fill" d="M10 100 A90 90 0 0 1 190 100" fill="none" stroke="#e0202b" stroke-width="8" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="283"/>
      </svg>
      <div class="speedo-value"><b id="speedo-kmh">0</b><span>km/h</span></div>
      <div class="speedo-gear" id="speedo-gear">P</div>
    </div>
  </div>

  <!-- ===================== NOTIFICATIONS ===================== -->
  <div class="notify-stack" id="notify-stack"></div>

  <script src="hud.js"></script>
</body>
</html>
